[package]
name = "browser-spaces"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "space-manager"
path = "src/bin/daemon.rs"

[[bin]]
name = "spacectl"
path = "src/bin/cli.rs"

[dependencies]
hyprland = "0.4.0-beta.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
evdev = "0.12"
gtk4 = "0.9"
glib = "0.20"
